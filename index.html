<!doctype html>
<html lang="id" dir="ltr">
  <head>
    <!-- 1. BASIC META TAGS -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <!-- Catatan: user-scalable=yes lebih baik untuk aksesibilitas SEO daripada no -->
    
    <title>EpanDStream — Nonton Anime & Donghua Sub Indo Terbaru HD</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Streaming Anime dan Donghua subtitle Indonesia terlengkap dan tercepat. Nonton One Piece, Solo Leveling, Battle Through the Heavens kualitas HD tanpa iklan mengganggu di EpanDStream." />
    <meta name="keywords" content="nonton anime sub indo, donghua sub indo, streaming anime terbaru, EpanDStream, anime HD, download anime, solo leveling sub indo, battle through the heavens" />
    <meta name="author" content="EpanDStream Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Canonical URL (PENTING: Ganti dengan domain asli Anda) -->
    <link rel="canonical" href="https://stream.epand.my.id/" />

    <!-- Geo Tags (Opsional, bagus untuk Local SEO) -->
    <meta name="geo.region" content="ID" />
    <meta name="geo.placename" content="Indonesia" />
    <meta name="language" content="Indonesian" />

    <!-- 2. OPEN GRAPH / FACEBOOK / WHATSAPP (Agar link terlihat bagus saat dishare) -->
    <meta property="og:locale" content="id_ID" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EpanDStream — Nonton Anime & Donghua Sub Indo" />
    <meta property="og:description" content="Platform streaming anime dan donghua sub Indo terbaik. Update tercepat dengan kualitas video HD." />
    <meta property="og:url" content="https://stream.epand.my.id/" />
    <meta property="og:site_name" content="EpanDStream" />
    <!-- Ganti URL gambar di bawah dengan banner asli situs Anda (Rasio 1200x630px disarankan) -->
    <meta property="og:image" content="https://stream.epand.my.id/epandstream.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EpanDStream Banner" />

    <!-- 3. TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EpanDStream — Nonton Anime & Donghua Sub Indo" />
    <meta name="twitter:description" content="Streaming anime dan donghua subtitle Indonesia kualitas HD." />
    <meta name="twitter:image" content="https://stream.epand.my.id/epandstream.jpg" />
    <!-- Jika punya akun Twitter/X -->
    <meta name="twitter:site" content="@epandstream" />

    <!-- 4. FAVICONS & ICONS (Pastikan file-file ini ada di folder public) -->
    <link rel="icon" href="/epandstream.png" type="image/png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/epandstream.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- 5. MOBILE & THEME SETTINGS -->
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EpanDStream" />
    <meta name="format-detection" content="telephone=no" />

    <!-- 6. PRECONNECTS & FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />

    <!-- 7. STRUCTURED DATA (JSON-LD) - SANGAT PENTING UNTUK GOOGLE -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://stream.epand.my.id/#organization",
            "name": "EpanDStream",
            "url": "https://epandstream.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://stream.epand.my.id/epandstream.png",
              "width": 512,
              "height": 512
            },
            "sameAs": [
              "https://facebook.com/epandstream",
              "https://twitter.com/epandstream",
              "https://instagram.com/epandstream"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://stream.epand.my.id/#website",
            "url": "https://stream.epand.my.id/",
            "name": "EpanDStream",
            "description": "Streaming Anime & Donghua Sub Indo",
            "publisher": {
              "@id": "https://stream.epand.my.id/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://stream.epand.my.id/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- 8. VERIFICATION TAGS (Isi content dengan kode dari Google Search Console) -->
    <!-- <meta name="google-site-verification" content="KODE_VERIFIKASI_ANDA" /> -->
    <!-- <meta name="msvalidate.01" content="KODE_BING_ANDA" /> -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
